# Pseudoscheme's continuous integration: the bootstrap chain from other
# Schemes, and every test suite (full continuations, the default, and
# escape-only).
# See boot/README.md and ROADMAP.md.  The benchmarks are a separate
# workflow, run by hand (bench.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The generated files from source alone, with two fast Schemes from
  # Ubuntu: Chez Scheme (R6RS) and Scheme 48 (R5RS).  Both write the .pso
  # files, which must agree; then psyntax's image is rebuilt from a seed
  # each of them builds (Chez natively, Scheme 48 through boot/stage0/),
  # with Pseudoscheme loaded from those .pso files.  Everything must come
  # out as checked in.
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-lisp

      - name: Install Chez Scheme and Scheme 48
        # boot/ calls Chez Scheme "chez"; Debian calls it chezscheme.
        # Chez finds its boot files by the name it was run as, so "chez"
        # is a script that runs chezscheme, not a link to it.
        run: |
          sudo apt-get install -y -qq chezscheme scheme48
          if ! command -v chez >/dev/null; then
            printf '#!/bin/sh\nexec chezscheme "$@"\n' | sudo tee /usr/local/bin/chez >/dev/null
            sudo chmod +x /usr/local/bin/chez
          fi
          echo '(display (scheme-version))' | chez -q; echo
          echo ',exit' | scheme48 | head -1

      - name: The .pso files, from Chez and from Scheme 48
        # They must agree with each other and, form for form, with
        # Pseudoscheme's own translation (--check).  Installed in src/.
        run: BOOT_HOSTS="chez scheme48" boot/bootstrap.sh --all --check

      - name: The .pso files match what's checked in
        # apart from the header comment naming the Scheme that wrote them
        run: git diff --exit-code -I '^;' -- src

      - name: psyntax's image, from Chez's seed
        run: boot/psyntax.sh --seed=chez

      - name: psyntax's image matches what's checked in
        run: git diff --exit-code -- vendor/psyntax/psyntax-pseudoscheme.pp

      - name: psyntax's image, from stage0's seed on Scheme 48
        # An unrelated expander's seed, on an R5RS Scheme, must end in
        # the same image.
        run: |
          STAGE0_HOST=scheme48 boot/psyntax.sh --no-install --seed=stage0
          cmp boot/build/psyntax/psyntax-pseudoscheme.pp vendor/psyntax/psyntax-pseudoscheme.pp

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs
          path: boot/build/**/*.log

  # Every test suite, with full continuations (the default) and escape-only,
  # the command line, the shipped SRFIs as a library corpus, and the
  # R7RS export table against the report.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-lisp

      - name: Test suites
        run: make test

      - name: Test suites with escape-only continuations
        run: make test-escape

      - name: Command line
        run: make test-cli

      - name: The shipped SRFIs as a library corpus
        run: |
          PSEUDOSCHEME_LIBRARY_CACHE=0 sbcl --dynamic-space-size 4GB --control-stack-size 500MB \
            --script tests/run-library-corpus.lisp src/srfi --skip reference | tee /tmp/corpus.txt
          # "N of M libraries load.": all of them must
          awk '/libraries load/ { found = 1; ok = ($1 == $3) } END { exit !(found && ok) }' /tmp/corpus.txt

      - name: The R7RS export table against the report
        run: |
          sudo apt-get install -y -qq poppler-utils
          curl -fsSLo /tmp/r7rs.pdf https://small.r7rs.org/attachment/r7rs.pdf
          python3 tests/check-r7rs-exports.py /tmp/r7rs.pdf

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/pseudoscheme-test-*.log
