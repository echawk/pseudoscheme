# Pseudoscheme's continuous integration: the bootstrap chain from other
# Schemes, every test suite (default mode and full continuations), and
# the benchmarks.  See boot/README.md, ROADMAP.md and bench/README.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The generated files from source alone: the .pso files written by
  # other Schemes, then psyntax's image seeded by Chez Scheme and rebuilt
  # by Pseudoscheme (loaded from those .pso files) until it reproduces
  # itself.  Both must match what's checked in.
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-lisp

      - name: Install the Schemes
        # Each is optional: boot/bootstrap.sh --all uses whichever are
        # installed (and they must all agree).  Chez is required, for the
        # psyntax seed.  boot/ calls Chez Scheme "chez"; Debian calls it
        # scheme or chezscheme.
        run: |
          for p in chezscheme guile-3.0 gauche chicken-bin racket scheme48 chibi-scheme; do
            sudo apt-get install -y -qq "$p" || echo "::warning::$p is not available"
          done
          if ! command -v chez >/dev/null; then
            sudo ln -s "$(command -v chezscheme || command -v scheme)" /usr/local/bin/chez
          fi
          chez --version
          for c in chibi-scheme guile gosh csi plt-r5rs scheme48; do
            command -v "$c" >/dev/null && echo "found $c" || echo "no $c"
          done

      - name: The .pso files, from every installed Scheme
        # Each host translates the translator; they must agree with each
        # other and, form for form, with Pseudoscheme's own translation
        # (--check).  Installs the result in src/.
        run: boot/bootstrap.sh --all --check

      - name: The .pso files match what's checked in
        # Apart from the header comment naming the Scheme that wrote them.
        run: git diff --exit-code -I '^;' -- src

      - name: psyntax's image, from a Chez seed
        # Pseudoscheme, loaded from the .pso files just written, rebuilds
        # the image until it reproduces itself.
        run: boot/psyntax.sh

      - name: psyntax's image matches what's checked in
        run: git diff --exit-code -- vendor/psyntax/psyntax-pseudoscheme.pp

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs
          path: boot/build/**/*.log

  # Every test suite, in the default mode and with full continuations,
  # the command line, the shipped SRFIs as a library corpus, and the
  # R7RS export table against the report.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-lisp

      - name: Test suites
        run: make test

      - name: Test suites with full continuations
        run: make test-full

      - name: Command line
        run: make test-cli

      - name: The shipped SRFIs as a library corpus
        run: |
          PSEUDOSCHEME_LIBRARY_CACHE=0 sbcl --dynamic-space-size 4GB --control-stack-size 500MB \
            --script tests/run-library-corpus.lisp src/srfi | tee /tmp/corpus.txt
          # "N of M libraries load.": all of them must
          awk '/libraries load/ { found = 1; ok = ($1 == $3) } END { exit !(found && ok) }' /tmp/corpus.txt

      - name: The R7RS export table against the report
        run: |
          sudo apt-get install -y -qq poppler-utils
          curl -fsSLo /tmp/r7rs.pdf https://small.r7rs.org/attachment/r7rs.pdf
          python3 tests/check-r7rs-exports.py /tmp/r7rs.pdf

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/pseudoscheme-test-*.log

  # ecraven's r7rs-benchmarks on the command line, escape-only and with
  # full continuations.  Results are artifacts; a benchmark that fails
  # shows as such in the table rather than failing the job.
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-lisp

      - name: Build the command line
        run: make -C contrib/cli

      - name: Benchmarks
        env:
          CPU_LIMIT: 300
          BENCH_TEMP: /tmp/r7rs-benchmarks
        run: |
          bench/run.sh pseudoscheme
          mkdir -p /tmp/bench
          mv bench/r7rs-benchmarks/results.Pseudoscheme /tmp/bench/results.Pseudoscheme

      - name: Benchmarks with full continuations
        env:
          CPU_LIMIT: 300
          BENCH_TEMP: /tmp/r7rs-benchmarks-full
        run: |
          printf '#!/bin/sh\nexec "%s/bin/pseudoscheme" --continuations=full "$@"\n' "$PWD" > /tmp/pseudoscheme-full
          chmod +x /tmp/pseudoscheme-full
          PSEUDOSCHEME=/tmp/pseudoscheme-full bench/run.sh pseudoscheme
          # named pseudoscheme_full, so the summary has a column for each
          sed 's/+!CSVLINE!+pseudoscheme-/+!CSVLINE!+pseudoscheme_full-/' \
            bench/r7rs-benchmarks/results.Pseudoscheme > /tmp/bench/results.PseudoschemeFull
          rm bench/r7rs-benchmarks/results.Pseudoscheme

      - name: Summary
        # Each benchmark's time in both modes, and full continuations'
        # ratio to escape-only.
        run: |
          echo "## r7rs-benchmarks: escape-only and full continuations" >> "$GITHUB_STEP_SUMMARY"
          python3 bench/summarize.py /tmp/bench --baseline pseudoscheme | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: /tmp/bench
